name: Build OrderONE
on:
  push:
    branches:
      - development
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # 1. Next.js フロントエンドのビルド（共通）
  # ─────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js (static export)
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

  # ─────────────────────────────────────────
  # 2. Mac .app ビルド (Apple Silicon)
  # ─────────────────────────────────────────
  build-mac:
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install "setuptools<70"
          pip install \
            pyinstaller eel \
            pandas numpy openpyxl xlsxwriter \
            bcrypt chardet rapidfuzz tzdata \
            python-dotenv

      - name: Build Mac .app
        run: pyinstaller OrderONE_Mac.spec

      - name: Ad-hoc Code Sign the .app
        run: |
          find dist/OrderONE.app -type f \( -name "*.dylib" -o -name "*.so" \) -print0 | \
            while IFS= read -r -d '' f; do
              codesign --force --sign - "$f" 2>/dev/null || true
            done
          find dist/OrderONE.app -name "*.framework" -type d | while read fw; do
            codesign --force --deep --sign - "$fw" 2>/dev/null || true
          done
          codesign --force --sign - "dist/OrderONE.app/Contents/MacOS/OrderONE" || true
          codesign --deep --force --sign - dist/OrderONE.app
          codesign --verify --verbose=2 dist/OrderONE.app && \
            echo "signature OK" || echo "signature warning (continuing)"

      - name: Zip Mac .app
        run: cd dist && zip -r ../OrderONE-Mac-arm64.zip OrderONE.app

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderONE-Mac-arm64
          path: OrderONE-Mac-arm64.zip

  # ─────────────────────────────────────────
  # 3. Windows .exe ビルド
  # ─────────────────────────────────────────
  build-windows:
    needs: build-frontend
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install "setuptools<70"
          pip install `
            pyinstaller eel `
            pandas numpy openpyxl xlsxwriter `
            bcrypt chardet rapidfuzz tzdata `
            python-dotenv
        shell: pwsh

      - name: Build Windows exe
        run: pyinstaller OrderONE_Win.spec
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderONE-Windows
          path: dist/OrderONE.exe

  # ─────────────────────────────────────────
  # 4. GitHub Release（タグ push 時のみ）
  # ─────────────────────────────────────────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OrderONE-Mac-arm64/OrderONE-Mac-arm64.zip
            OrderONE-Windows/OrderONE.exe
